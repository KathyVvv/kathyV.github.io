<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A clean, customizable HTML starter page." />
  <title>My Website</title>
  <style>
    :root { color-scheme: light; --ink: #182036; --muted: #647087; --accent: #6854d7; --background: #f7f7fc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: linear-gradient(135deg, #f3edff, #f7f9ff 55%, #e9f9f5); font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); }
    main { width: min(100%, 700px); background: white; padding: clamp(28px, 6vw, 60px); border: 1px solid #ebebf4; border-radius: 24px; box-shadow: 0 18px 70px rgba(35, 35, 85, .09); text-align: center; }
    .eyebrow { color: var(--accent); font-weight: 700; letter-spacing: .11em; text-transform: uppercase; font-size: .78rem; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.15; letter-spacing: -.04em; margin: 18px 0; }
    p { color: var(--muted); margin: 0 auto 28px; max-width: 50ch; }
    button { border: 0; background: var(--accent); color: #fff; padding: 13px 24px; border-radius: 999px; font: inherit; font-weight: 650; cursor: pointer; transition: transform .2s, background .2s; }
    button:hover { background: #5541bd; transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid #a79af7; outline-offset: 4px; }
    #message { min-height: 1.5em; margin: 18px 0 0; font-weight: 600; color: var(--accent); }
    footer { margin-top: 32px; color: #9299aa; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Welcome</div>
    <h1 id="helloTitle" style="cursor: pointer;"> Hello, world! ✨</h1>
    <img id="myImage" src="1746501514123.jpg" alt="My picture" width="300" style="display: none;">
    <p>This is your new HTML webpage. Change the heading, colors, and content to make it your own.</p>
    <button id="helloButton" type="button">Click me</button>
    <div id="message" role="status" aria-live="polite"></div>
    <footer>Made with HTML, CSS &amp; JavaScript</footer>
  </main>
  <script>
    document.getElementById('helloButton').addEventListener('click', () => {document.getElementById('message').textContent = 'Your webpage is working! 🎉';}); document.getElementById('helloTitle').addEventListener('click', () => {const image = document.getElementById('myImage'); if (image.style.display === 'none') {image.style.display = 'block';} else {image.style.display = 'none';}});
  </script>
</body>
</html>
